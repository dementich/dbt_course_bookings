models:
  - name: stg_flights__aircrafts
    description: '{{ doc("aircrafts_description") }}'
    columns:
      - name: aircraft_code
        tests:
          - not_null
          - unique
        description: >
          Идентификатор модели самолета.
          Состоит из трех латинских букв.
      - name: model
        description: Название модели самолета
      - name: range
        description: Максимальная дальность полета
  - name: stg_flights__airports
    description: Данные аэропортов
    columns:
      - name: airport_code
        description: Международные идентификационный код аэропорта
      - name: airport_name
        description: Название аэропорта
      - name: city
        description: Город, к которому относится аэропорт
      - name: coordinates
        description: Координаты расположения аэропорта
      - name: timezone
        description: Временная зона аэропорта
  - name: stg_flights__seats
    description: Информация по посадочным местам
    columns:
      - name: aircraft_code
        description: Код модели самолета, к которому относится данное посадочное место
      - name: seat_no
        description: Номер посадочного места
      - name: fare_conditions
        description: Условия оплаты
  - name: stg_flights__bookings
    description: Данные по бронированиям
    columns:
        - name: book_ref
          description: Номер бронирования
        - name: book_date
          description: Дата бронирования
        - name: total_amount
          description: Стоимость бронирования
  - name: stg_flights__boarding_passes
    description: Данные по посадочным талонам
    columns:
      - name: ticket_no
        description: Номер авиабилета
      - name: flight_id
        description: Уникальный идентификартор рейса
      - name: boarding_no
        description: Номер посадки
      - name: seat_no
        description: Номер посадочного места
  - name: stg_flights__flights
    description: Данные авиарейсов
    columns:
      - name: flight_id
        description: Уникальный технический идентификатор рейса
      - name: flight_no
        description: Номер рейса
      - name: scheduled_departure
        description: Время вылета по расписанию
      - name: scheduled_arrival
        description: Время прилета по расписанию
      - name: departure_airport
        description: Аэропорт вылета
      - name: arrival_airport
        description: Аэропорт прилета
      - name: status
        description: Статус авиарейса
      - name: aircraft_code
        description: Код модели самолета
      - name: actual_departure
        description: Время вылета фактическое
      - name: actual_arrival
        description: Время прилета фактическое
  - name: stg_flights__ticket_flights
    description: Билеты по рейсам
    columns:
      - name: ticket_no
        description: Уникальный номер билета
      - name: flight_no
        description: Номер рейса
      - name: fare_conditions
        description: Класс обслуживания
      - name: amount
        description: Стоимость билета
  - name: stg_flights__tickets
    description: Данные по авиабилетам
    columns:
      - name: ticket_no
        description: Уникальный идентификатор билета
      - name: book_ref
        description: Номер брони
      - name: passenger_id
        description: Идентификатор пассажира
      - name: passenger_name
        description: Имя пассажира
      - name: contact_data
        description: Контактные данные пассажира