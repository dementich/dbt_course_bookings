sources:
  - name: demo_src
    database: dwh_flight
    schema: demo_src
    tables:
      - name: aircrafts
      - name: airports
      - name: seats
      - name: bookings
        freshness:
          warn_after:
            count: 60000
            period: hour
          error_after:
            count: 10000
            period: day
          filter: current_timestamp::date - book_date::date < 3
        loaded_at_field: book_date::timestamp
      - name: boarding_passes
      - name: flights
        freshness:
          warn_after:
            count: 1000
            period: day
          error_after:
            count: 5000
            period: day
        loaded_at_field: actual_departure
      - name: ticket_flights
      - name: tickets