sources:
  - name: demo_src
    database: dwh_flight
    schema: demo_src
    tables:
      - name: boarding_passes
        description: Данные по посадочным талонам
        columns:
          - name: ticket_no
            description: Номер авиабилета
          - name: flight_id
            description: Уникальный идентификартор рейса
          - name: boarding_no
            description: Номер посадки
          - name: seat_no
            description: Номер посадочного места
      - name: flights
        description: Данные авиарейсов
        columns:
          - name: flight_id
            description: Уникальный технический идентификатор рейса
          - name: flight_no
            description: Номер рейса
          - name: scheduled_departure
            description: Время вылета по расписанию
          - name: scheduled_arrival
            description: Время прилета по расписанию
          - name: departure_airport
            description: Аэропорт вылета
          - name: arrival_airport
            description: Аэропорт прилета
          - name: status
            description: Статус авиарейса
          - name: aircraft_code
            description: Код модели самолета
          - name: actual_departure
            description: Время вылета фактическое
          - name: actual_arrival
            description: Время прилета фактическое
        freshness:
          warn_after:
            count: 1000
            period: day
          error_after:
            count: 5000
            period: day
        loaded_at_field: actual_departure
      - name: ticket_flights
        description: Билеты по рейсам
        columns:
          - name: ticket_no
            description: Уникальный номер билета
          - name: flight_no
            description: Номер рейса
          - name: fare_conditions
            description: Класс обслуживания
          - name: amount
            description: Стоимость билета
      - name: tickets
        description: Данные по авиабилетам
        columns:
          - name: ticket_no
            description: Уникальный идентификатор билета
          - name: book_ref
            description: Номер брони
          - name: passenger_id
            description: Идентификатор пассажира
          - name: passenger_name
            description: Имя пассажира
          - name: contact_data
            description: Контактные данные пассажира